[project]
name = "career-ai-core"
version = "0.1.0"
description = "Reusable conversational CV application powered by Gemini and Gradio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=2.33.0",
  "gradio>=6.31.0",
  "pydantic>=2.14.3",
  "python-dotenv>=1.2.4",
  "pyyaml>=6.0.3",
]

[project.scripts]
career-ai = "career_ai_core:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
